name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag to create or update"
        required: true
        default: "v0.1.0-prealpha.1"
      release_name:
        description: "GitHub release title"
        required: true
        default: "Solmë prealpha 0.1"
      draft:
        description: "Create the release as a draft"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish-linux:
    name: Linux bundles
    runs-on: ubuntu-22.04

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      RELEASE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_name || format('Solmë {0}', github.ref_name) }}
      RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "1"
      ARCH: "x86_64"
      DATABASE_URL: "sqlite:///tmp/solme-ci.sqlite"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libmpv-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            sqlite3 \
            xdg-utils

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare SQLx compile-time database
        run: |
          rm -f /tmp/solme-ci.sqlite
          sqlite3 /tmp/solme-ci.sqlite "PRAGMA journal_mode=WAL;"
          for migration in src-tauri/migrations/*.sql; do
            sqlite3 /tmp/solme-ci.sqlite < "$migration"
          done

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: "Pre-alpha build. Download one of the attached Tauri bundles."
          releaseDraft: ${{ env.RELEASE_DRAFT }}
          prerelease: true
          args: "--bundles deb,appimage,rpm"
          releaseAssetNamePattern: "[name]-[version]-[platform]-[arch][ext]"

  publish-windows:
    name: Windows bundles
    runs-on: windows-latest

    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
      RELEASE_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_name || format('Solmë {0}', github.ref_name) }}
      RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
      DATABASE_URL: "sqlite://solme-ci.sqlite"
      MPV_DEV_URL: "https://downloads.sourceforge.net/project/mpv-player-windows/libmpv/mpv-dev-x86_64-20260607-git-71ebd08.7z"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC developer tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows build dependencies
        shell: pwsh
        run: |
          choco install 7zip sqlite -y

      - name: Prepare libmpv for Windows
        shell: pwsh
        run: |
          $mpvDir = Join-Path $env:GITHUB_WORKSPACE "src-tauri\mpv"
          $archive = Join-Path $env:RUNNER_TEMP "mpv-dev.7z"
          New-Item -ItemType Directory -Force -Path $mpvDir | Out-Null
          curl.exe --location --fail --retry 3 --output $archive $env:MPV_DEV_URL
          if ((Get-Item $archive).Length -lt 10000000) {
            throw "Downloaded mpv archive is unexpectedly small; SourceForge likely returned an HTML page"
          }
          7z x $archive "-o$mpvDir" -y
          Get-ChildItem $mpvDir

          if (!(Test-Path "$mpvDir\libmpv-2.dll")) {
            throw "libmpv-2.dll was not extracted to $mpvDir"
          }
          $exports = & dumpbin /nologo /exports "$mpvDir\libmpv-2.dll"
          $names = $exports | ForEach-Object {
            if ($_ -match '^\s+\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)$') {
              $matches[1]
            }
          }
          @("LIBRARY libmpv-2.dll", "EXPORTS") + $names | Set-Content "$mpvDir\mpv.def" -Encoding ASCII
          & lib /nologo /def:"$mpvDir\mpv.def" /machine:x64 /out:"$mpvDir\mpv.lib"

          dumpbin /nologo /dependents "$mpvDir\libmpv-2.dll"

          Add-Content -Path $env:GITHUB_PATH -Value $mpvDir
          Add-Content -Path $env:GITHUB_ENV -Value "LIB=$mpvDir;$env:LIB"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare SQLx compile-time database
        shell: pwsh
        run: |
          $dbPath = "src-tauri\solme-ci.sqlite"
          Remove-Item $dbPath -ErrorAction SilentlyContinue
          sqlite3 $dbPath "PRAGMA journal_mode=WAL;"
          Get-ChildItem src-tauri/migrations/*.sql | Sort-Object Name | ForEach-Object {
            Get-Content $_.FullName -Raw | sqlite3 $dbPath
          }
          if (!(Test-Path $dbPath)) {
            throw "Expected SQLx database at $dbPath before Tauri build"
          }

      - name: Verify Windows bundled libraries
        shell: pwsh
        run: |
          if (!(Test-Path "src-tauri\mpv\libmpv-2.dll")) {
            throw "Expected src-tauri\mpv\libmpv-2.dll before Tauri build"
          }
          Get-Item "src-tauri\mpv\libmpv-2.dll"

      - name: Build and publish Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_NAME }}
          releaseBody: "Pre-alpha build. Download one of the attached Tauri bundles."
          releaseDraft: ${{ env.RELEASE_DRAFT }}
          prerelease: true
          args: >-
            --bundles nsis,msi
          releaseAssetNamePattern: "[name]-[version]-[platform]-[arch][ext]"

      - name: Verify Windows bundles and libmpv startup
        shell: pwsh
        run: |
          $nsisInstaller = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (!$nsisInstaller) {
            throw "Expected an NSIS installer"
          }

          $nsisContents = & 7z l $nsisInstaller.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect the NSIS installer"
          }
          if ($nsisContents -notmatch "libmpv-2\.dll") {
            throw "NSIS installer does not contain libmpv-2.dll"
          }

          $msiInstaller = Get-ChildItem "src-tauri\target\release\bundle\msi\*.msi" | Select-Object -First 1
          if (!$msiInstaller) {
            throw "Expected an MSI installer"
          }

          $msiContents = & 7z l $msiInstaller.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect the MSI installer"
          }
          if ($msiContents -notmatch "libmpv-2\.dll") {
            throw "MSI installer does not contain libmpv-2.dll"
          }

          $installDir = Join-Path $env:RUNNER_TEMP "solme-smoke-install"
          if (Test-Path $installDir) {
            Remove-Item $installDir -Recurse -Force
          }

          $installerProcess = Start-Process `
            -FilePath $nsisInstaller.FullName `
            -ArgumentList "/S", "/D=$installDir" `
            -Wait `
            -PassThru
          if ($installerProcess.ExitCode -ne 0) {
            throw "NSIS installer failed with exit code $($installerProcess.ExitCode)"
          }

          $appExecutable = Get-ChildItem $installDir -Filter "solme.exe" -Recurse | Select-Object -First 1
          if (!$appExecutable) {
            throw "Installed solme.exe was not found"
          }

          $bundledMpv = Join-Path $appExecutable.DirectoryName "libmpv-2.dll"
          if (!(Test-Path $bundledMpv)) {
            throw "libmpv-2.dll is not installed next to solme.exe"
          }

          $appProcess = Start-Process -FilePath $appExecutable.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($appProcess.HasExited) {
            throw "Solmë exited during the Windows startup smoke test with code $($appProcess.ExitCode)"
          }

          Stop-Process -Id $appProcess.Id -Force
